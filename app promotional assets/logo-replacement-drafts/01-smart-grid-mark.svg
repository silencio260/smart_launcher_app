<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Smart Grid Mark</title>
  <desc id="desc">A rounded launcher icon with an organized app grid, a home cue, and a smart highlight tile.</desc>
  <defs>
    <linearGradient id="bg" x1="144" y1="80" x2="880" y2="944" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#101827"/>
