    <rect x="622" y="258" width="132" height="132" rx="38" fill="url(#tileCool)" opacity="0.94"/>
    <rect x="270" y="434" width="132" height="132" rx="38" fill="url(#tileCool)" opacity="0.72"/>
    <rect x="446" y="434" width="132" height="132" rx="38" fill="url(#tileHot)"/>
    <rect x="622" y="434" width="132" height="132" rx="38" fill="url(#tileCool)" opacity="0.72"/>
    <rect x="270" y="610" width="132" height="132" rx="38" fill="url(#tileCool)" opacity="0.94"/>
    <rect x="446" y="610" width="132" height="132" rx="38" fill="url(#tileCool)" opacity="0.78"/>
