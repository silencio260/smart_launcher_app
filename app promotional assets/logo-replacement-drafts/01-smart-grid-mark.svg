      <stop offset="1" stop-color="#0C2533"/>
    </linearGradient>
    <linearGradient id="tileHot" x1="318" y1="300" x2="706" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#56F0D0"/>
      <stop offset="1" stop-color="#3D78FF"/>
    </linearGradient>
    <linearGradient id="tileCool" x1="260" y1="238" x2="722" y2="810" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAF7FF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#99B8C8" stop-opacity="0.68"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="34" stdDeviation="34" flood-color="#000000" flood-opacity="0.34"/>
