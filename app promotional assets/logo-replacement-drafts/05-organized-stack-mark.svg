<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Organized Stack Mark</title>
  <desc id="desc">A layered card and dock mark for a clean, organized launcher experience.</desc>
  <defs>
    <linearGradient id="bg" x1="112" y1="80" x2="912" y2="944" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14203A"/>
      <stop offset="0.45" stop-color="#243A66"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="card1" x1="252" y1="226" x2="768" y2="786" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCEAFF"/>
    </linearGradient>
    <linearGradient id="card2" x1="222" y1="306" x2="700" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#72F2DB"/>
      <stop offset="1" stop-color="#3578FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="34" stdDeviation="32" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <path d="M160 520c100-172 246-260 430-260 126 0 222 36 288 108" fill="none" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" opacity="0.08"/>
  <g filter="url(#shadow)">
