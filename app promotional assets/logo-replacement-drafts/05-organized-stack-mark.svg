    <rect x="318" y="244" width="452" height="346" rx="72" transform="rotate(9 544 417)" fill="#FFFFFF" opacity="0.23"/>
    <rect x="286" y="278" width="452" height="468" rx="82" fill="url(#card1)"/>
  </g>
  <rect x="350" y="354" width="90" height="90" rx="28" fill="#1ED2BD"/>
  <rect x="467" y="354" width="90" height="90" rx="28" fill="#3862FF"/>
  <rect x="584" y="354" width="90" height="90" rx="28" fill="#0C203A" opacity="0.18"/>
  <rect x="350" y="480" width="324" height="48" rx="24" fill="#0C203A" opacity="0.14"/>
  <rect x="350" y="570" width="324" height="84" rx="42" fill="#10233F"/>
  <circle cx="414" cy="612" r="24" fill="#59F0D5"/>
  <circle cx="512" cy="612" r="24" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="610" cy="612" r="24" fill="#4C79FF"/>
  <path d="M512 214 548 270h-72l36-56Z" fill="#59F0D5"/>
