<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Search Orbit Mark</title>
  <desc id="desc">A search-first launcher symbol with an orbit around a compact home screen.</desc>
  <defs>
    <radialGradient id="bg" cx="31%" cy="20%" r="86%">
      <stop offset="0" stop-color="#E8FDF8"/>
      <stop offset="0.42" stop-color="#43D9C4"/>
      <stop offset="1" stop-color="#2147B8"/>
    </radialGradient>
    <linearGradient id="screen" x1="344" y1="242" x2="696" y2="788" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D8F0FF"/>
    </linearGradient>
    <linearGradient id="orbit" x1="220" y1="742" x2="812" y2="274" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.54" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="34" stdDeviation="38" flood-color="#0B1555" flood-opacity="0.36"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <circle cx="760" cy="236" r="96" fill="#FFFFFF" opacity="0.14"/>
  <circle cx="196" cy="804" r="142" fill="#061147" opacity="0.18"/>
  <ellipse cx="512" cy="512" rx="358" ry="232" transform="rotate(-28 512 512)" fill="none" stroke="url(#orbit)" stroke-width="36" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <rect x="360" y="248" width="304" height="528" rx="94" fill="url(#screen)"/>
    <rect x="408" y="318" width="92" height="92" rx="28" fill="#29C6B6"/>
    <rect x="524" y="318" width="92" height="92" rx="28" fill="#355DFF"/>
    <rect x="408" y="434" width="92" height="92" rx="28" fill="#8EEADF"/>
    <rect x="524" y="434" width="92" height="92" rx="28" fill="#BFD1FF"/>
    <path d="M512 572 610 650H414l98-78Z" fill="#0B2555" opacity="0.86"/>
    <rect x="448" y="666" width="128" height="32" rx="16" fill="#0B2555" opacity="0.2"/>
  </g>
  <circle cx="646" cy="654" r="86" fill="none" stroke="#FFFFFF" stroke-width="42"/>
  <path d="M710 718 786 794" stroke="#FFFFFF" stroke-width="50" stroke-linecap="round"/>
  <circle cx="257" cy="571" r="32" fill="#FFFFFF"/>
</svg>
