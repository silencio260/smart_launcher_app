<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Page Stack Dock</title>
  <desc id="desc">Layered launcher pages with a dock, designed as a clean OS icon.</desc>
  <defs>
    <linearGradient id="bg" x1="116" y1="100" x2="900" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="0.48" stop-color="#183A63"/>
      <stop offset="1" stop-color="#070D18"/>
    </linearGradient>
    <linearGradient id="page" x1="300" y1="240" x2="730" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7FCFF"/>
      <stop offset="1" stop-color="#DCE9F6"/>
    </linearGradient>
    <linearGradient id="side" x1="214" y1="360" x2="688" y2="770" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#62FFE0"/>
      <stop offset="1" stop-color="#2F69FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="34" stdDeviation="36" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <path d="M258 716c118 74 288 86 440 24" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" opacity="0.1"/>
  <g filter="url(#shadow)">
    <rect x="272" y="330" width="396" height="390" rx="88" fill="url(#side)" transform="rotate(-11 470 525)"/>
    <rect x="356" y="260" width="396" height="390" rx="88" fill="#FFFFFF" opacity="0.18" transform="rotate(10 554 455)"/>
    <rect x="314" y="298" width="396" height="446" rx="94" fill="url(#page)"/>
  </g>
  <rect x="374" y="376" width="78" height="78" rx="26" fill="#15C9B8"/>
  <rect x="484" y="376" width="78" height="78" rx="26" fill="#3368FF"/>
  <rect x="594" y="376" width="78" height="78" rx="26" fill="#C1CCD8"/>
  <rect x="374" y="506" width="298" height="46" rx="23" fill="#0D2036" opacity="0.18"/>
  <rect x="374" y="606" width="298" height="64" rx="32" fill="#0D2036"/>
  <circle cx="434" cy="638" r="21" fill="#5DFFE0"/>
  <circle cx="523" cy="638" r="21" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="612" cy="638" r="21" fill="#4370FF"/>
</svg>
