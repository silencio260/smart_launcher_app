    <rect x="310" y="278" width="404" height="440" rx="86" fill="#0D2035" opacity="0.12"/>
    <rect x="342" y="320" width="92" height="92" rx="30" fill="#13C8B7"/>
    <rect x="466" y="320" width="92" height="92" rx="30" fill="#3670FF"/>
    <rect x="590" y="320" width="92" height="92" rx="30" fill="#BAC7D8"/>
    <rect x="342" y="444" width="92" height="92" rx="30" fill="#8BE9DD"/>
    <rect x="466" y="444" width="92" height="92" rx="30" fill="#FFFFFF"/>
    <rect x="590" y="444" width="92" height="92" rx="30" fill="#9EB9FF"/>
    <rect x="342" y="612" width="340" height="64" rx="32" fill="#0B1220"/>
    <circle cx="410" cy="644" r="22" fill="#5DFFE0"/>
