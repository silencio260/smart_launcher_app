<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">OS Home Surface</title>
  <desc id="desc">Adaptive launcher icon showing a home screen surface with app tiles and a dock.</desc>
  <defs>
    <linearGradient id="bg" x1="152" y1="104" x2="872" y2="928" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.52" stop-color="#102D4A"/>
      <stop offset="1" stop-color="#050914"/>
    </linearGradient>
    <linearGradient id="plate" x1="280" y1="208" x2="744" y2="832" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAF8FF"/>
      <stop offset="1" stop-color="#BFD1E2"/>
    </linearGradient>
    <linearGradient id="accent" x1="354" y1="270" x2="680" y2="744" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5DFFE0"/>
      <stop offset="1" stop-color="#3370FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="34" stdDeviation="34" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <circle cx="760" cy="230" r="130" fill="#FFFFFF" opacity="0.07"/>
  <circle cx="260" cy="786" r="150" fill="#45E6CC" opacity="0.08"/>
