<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Category Orbit</title>
  <desc id="desc">Organized launcher category tiles orbiting a central app drawer core.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="90" x2="900" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7FAFF"/>
      <stop offset="1" stop-color="#CBDCEB"/>
    </linearGradient>
    <linearGradient id="core" x1="312" y1="280" x2="704" y2="744" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#183A63"/>
    </linearGradient>
    <linearGradient id="tile" x1="236" y1="220" x2="778" y2="806" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#63FFE1"/>
      <stop offset="0.52" stop-color="#36B5FF"/>
      <stop offset="1" stop-color="#3A5DFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="30" stdDeviation="30" flood-color="#17304A" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="284" fill="#FFFFFF" opacity="0.56"/>
  <circle cx="512" cy="512" r="234" fill="none" stroke="#17304A" stroke-width="24" opacity="0.1"/>
  <g filter="url(#shadow)">
    <rect x="418" y="162" width="188" height="188" rx="56" fill="url(#tile)"/>
    <rect x="674" y="418" width="188" height="188" rx="56" fill="#10233B"/>
    <rect x="418" y="674" width="188" height="188" rx="56" fill="url(#tile)"/>
    <rect x="162" y="418" width="188" height="188" rx="56" fill="#FFFFFF"/>
    <circle cx="512" cy="512" r="154" fill="url(#core)"/>
  </g>
  <rect x="438" y="438" width="58" height="58" rx="18" fill="#5DFFE0"/>
  <rect x="528" y="438" width="58" height="58" rx="18" fill="#FFFFFF"/>
  <rect x="438" y="528" width="58" height="58" rx="18" fill="#FFFFFF" opacity="0.78"/>
  <rect x="528" y="528" width="58" height="58" rx="18" fill="#3D70FF"/>
  <path d="M428 620h168" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" opacity="0.72"/>
</svg>
