name: smart_launcher_app
description: "Smart Launcher - Flutter home screen replacement"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  flutter_bloc: ^9.0.0
  bloc: ^9.0.0
  equatable: ^2.0.7
  get_it: ^8.0.0
  smooth_page_indicator: ^1.2.0+3
  palette_generator: ^0.3.3
  google_fonts: ^6.2.1
  permission_handler: ^12.0.0+1
  uuid: ^4.5.1
  intl: ^0.20.1
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
